<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netwon-Raphson Method Visualisator</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js" type="text/javascript"></script>
</head>
<body>
    <div class="header">
        <div class="title">
            <h1>Netwon-Raphson Method Visualisator</h1>
        </div>
    </div>
    <div class="body">
        <div class="navigation">
            <a href="./table.html">Go back to the table</a>
            <a href="./index.html">Change initial parameters</a>
        </div>
        <div class="info">
            <h2>Graph Information</h2>

            <p id="function"></p>
            <p id="derivative"></p>
            <p id="tangent"></p>
            <p id="iteration"></p>
            <p id="rootTol"></p>
            <p id="derivativeTol"></p>
            <p id="approximation"></p>
            <p id="f(x)"></p>
            <p id="f'(x)"></p>
            <p id="status"></p>
        </div>
        <canvas id="graph" width="900" height="630"></canvas>
        <div class="buttons">
            <button id="previous">Previous</button>
            <div>
                <select id="iter"></select>
                <button id="changeIter">Change Iteration</button>
            </div>
            <button id="goTo">Go to Iteration</button>
            <div>
                <input id="xCoord" type="number" placeholder="X coordinate" min="-1000000" max="1000000">
                <input id="yCoord" type="number" placeholder="Y coordinate">
                <button id="teleport">Teleport</button>
            </div>
            <button id="origin">Origin</button>
            <button id="next">Next</button>
        </div>
    </div>
    <script src="./JS/method.js"></script>
    <script src="./JS/canvas.js"></script>
    <script src="./JS/graph.js"></script>
</body>
</html>
