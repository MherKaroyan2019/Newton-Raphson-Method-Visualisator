<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Newton-Raphson Method visualizer showing root approximation, iterations, and tangent graphs.">
    <meta name="google-site-verification" content="GTQnF6tTggydldYH8durjWYeU4RVaYiIe9wu-o1a2Fo" />
    <title>Newton-Raphson Method Visualiser</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js" type="text/javascript"></script>
</head>
<body>
    <div class="header">
        <div class="title">
            <h1>Newton-Raphson Method Visualiser</h1>
        </div>
    </div>
    <div class="body">
        <div class="inputs">
            <h2>Initial Data</h2>
            <label for="func">Function</label>
            <input type="text" id="func">
            <label for="start">Starting Initial Guess</label>
            <input type="number" id="start" min="-1000" max="1000" value="0">
            <label for="end">Ending Initial Guess</label>
            <input type="number" id="end" min="-1000" max="1000" value="0">
            <label>Step = 2<sup>a</sup> × 5<sup>b</sup></label>
            <div id="stepVar">
                <div>
                    <label for="stepA">a</label>
                    <input type="number" id="stepA" value="-1" min="-5" max="5">
                </div>
                <div>
                    <label for="stepB">b</label>
                    <input type="number" id="stepB" value="-1" min="-5" max="5">
                </div>
            </div>
            <p id="step">Step value: <span id="stepResult">0.1</span></p>
            <label for="rootTol">Root Tolerance</label>
            <select id="rootTol">
                <option value="2">10 ^ -2</option>
                <option value="4" selected>10 ^ -4</option>
                <option value="6">10 ^ -6</option>
                <option value="8">10 ^ -8</option>
                <option value="10">10 ^ -10</option>
            </select>
            <label for="derivTol">Derivative Tolerance</label>
            <select id="derivTol">
                <option value="6">10 ^ -6</option>
                <option value="8">10 ^ -8</option>
                <option value="10">10 ^ -10</option>
                <option value="12">10 ^ -12</option>
                <option value="14">10 ^ -14</option>
            </select>
            <button class="initial_data">Calculate</button>
            <p id="err"></p>
        </div>

    </div>
    <script src="./JS/validation.js"></script>
    <script src="./JS/get.js"></script>
</body>
</html>
